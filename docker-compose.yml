services:
  redis:
    # redis-stack-server bundles RedisBloom; plain redis images fall back to an exact Set.
    image: ${REDIS_IMAGE:-redis/redis-stack-server:7.2.0-v13}
    container_name: crawler-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      # Append-only file: queues, leases and job state survive a Redis restart.
      - REDIS_ARGS=--appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - crawler-net

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: crawler-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - crawler-net

  crawler-engine:
    build:
      context: ./services/crawler-engine
      dockerfile: Dockerfile
    container_name: crawler-engine-worker
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
      - WORKER_COUNT=5
      - FETCH_TIMEOUT_SEC=10
      - POLITENESS_DELAY_MS=1000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - crawler-net

  parser-scraper:
    build:
      context: ./services/parser-scraper
      dockerfile: Dockerfile
    container_name: crawler-parser-scraper
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POLL_TIMEOUT_SEC=2
      # Durable Markdown copy of every parsed document, one folder per job.
      - OUTPUT_DIR=/data/output
    volumes:
      - ./output:/data/output
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - crawler-net

volumes:
  redis_data:
    driver: local

networks:
  crawler-net:
    driver: bridge
