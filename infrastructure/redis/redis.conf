# ==============================================================================
# Redis Configuration for Distributed Web Crawler & URL Frontier
# ==============================================================================

# Network
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General
daemonize no
loglevel notice

# Persistence: RDB & AOF
# Snapshotting: Save after 60 seconds if at least 1000 keys changed
save 60 1000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Append Only File (AOF) for high durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Management
# 512MB RAM allocated for Frontier queues and Seen sets
maxmemory 512mb

# CRITICAL FOR QUEUES:
# Do not evict keys automatically! A crawler queue must NEVER drop URLs
# silently. If memory fills up, raise an error instead of losing state.
maxmemory-policy noeviction

# Performance Tuning
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
